name: ข่าวเช้า MK (daily)

# รันทุกเช้า 03:00/04:00/05:00 เวลาไทย (GitHub cron ดีเลย์บ่อย เลยยิง 3 ครั้ง)
on:
  schedule:
    - cron: "0 20 * * *"   # 03:00 ไทย
    - cron: "0 21 * * *"   # 04:00 ไทย
    - cron: "0 22 * * *"   # 05:00 ไทย
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate Thai news via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-news.mjs || echo "Gemini ดึงไม่ได้ (503/429 ชั่วคราว) — ใช้ data.js เดิมไปก่อน ไม่นับว่าล้มเหลว"
      - name: Commit & push if changed
        run: |
          git config user.name "MKIS News Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "ข่าวเช้า $(TZ=Asia/Bangkok date +%Y-%m-%d)"
            git push
          fi
