<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ข่าวเช้า MK</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="app-icon-192.png">
<link rel="apple-touch-icon" href="app-icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ข่าว MKIS">
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#eef1f5; --ink:#152130; --muted:#5c6775;
    --line:#e2e7ee; --accent:#d9761a; --accent-ink:#ffffff;
    --green:#15a34a; --amber:#c08600; --grey:#8a94a2; --star:#f0a500;
    --shadow:0 1px 3px rgba(20,30,45,.08),0 1px 2px rgba(20,30,45,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e131a; --surface:#161d26; --surface2:#1e2732; --ink:#eef3f9; --muted:#93a1b2;
      --line:#26313f; --accent:#ff9a3c; --accent-ink:#1a1206;
      --green:#34d17f; --amber:#e5b544; --grey:#8894a3; --star:#ffc23d;
      --shadow:0 1px 3px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"]{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#eef1f5; --ink:#152130; --muted:#5c6775;
    --line:#e2e7ee; --accent:#d9761a; --accent-ink:#ffffff;
    --green:#15a34a; --amber:#c08600; --grey:#8a94a2; --star:#f0a500;
    --shadow:0 1px 3px rgba(20,30,45,.08),0 1px 2px rgba(20,30,45,.04);
  }
  :root[data-theme="dark"]{
    --bg:#0e131a; --surface:#161d26; --surface2:#1e2732; --ink:#eef3f9; --muted:#93a1b2;
    --line:#26313f; --accent:#ff9a3c; --accent-ink:#1a1206;
    --green:#34d17f; --amber:#e5b544; --grey:#8894a3; --star:#ffc23d;
    --shadow:0 1px 3px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;
    font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 60px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 16px) 12px calc(env(safe-area-inset-left,0px) + 16px);
    border-bottom:1px solid var(--line);max-width:640px;margin:0 auto}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{width:40px;height:40px;border-radius:11px;overflow:hidden;flex-shrink:0}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
  .brand p{margin:1px 0 0;font-size:13px;color:var(--muted)}
  .hbtns{display:flex;gap:8px;flex-shrink:0}
  .tbtn{background:var(--surface2);border:1px solid var(--line);color:var(--ink);
    height:40px;min-width:40px;padding:0 12px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
  .tbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .tabs{display:flex;gap:8px;margin-top:14px}
  .tab{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--muted);
    padding:9px 3px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .dates{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
  .dates::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:8px 14px;border-radius:20px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .chip .d{font-size:12px;color:var(--muted);font-weight:600}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip.on .d{color:var(--bg);opacity:.7}
  .exec{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:14px 0;box-shadow:var(--shadow)}
  .exec .lbl{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--accent);text-transform:uppercase}
  .exec p{margin:7px 0 0;font-size:16.5px;line-height:1.5}
  .exec .cnt{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;font-weight:700;color:var(--green)}
  .grouphead{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:17px;font-weight:800;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px 17px;margin-bottom:12px;box-shadow:var(--shadow)}
  .ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .rate{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .rate .dot{width:9px;height:9px;border-radius:50%}
  .rate.green{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
  .rate.green .dot{background:var(--green)}
  .rate.amber{color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,transparent)}
  .rate.amber .dot{background:var(--amber)}
  .rate.grey{color:var(--grey);background:color-mix(in srgb,var(--grey) 16%,transparent)}
  .rate.grey .dot{background:var(--grey)}
  .star{background:none;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0;color:var(--grey);flex-shrink:0}
  .star.on{color:var(--star)}
  .card h3{margin:11px 0 6px;font-size:19px;line-height:1.4;font-weight:800}
  .src{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .summary{margin:9px 0 0;font-size:16.5px;color:var(--ink)}
  .why{margin-top:11px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15.5px}
  .why .k{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--accent);text-transform:uppercase;display:block;margin-bottom:3px}
  .why .act{display:block;margin-top:7px;color:var(--muted)}
  .cardfoot{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  .xlate{background:none;border:1px solid var(--line);color:var(--accent);border-radius:9px;
    padding:7px 12px;font-size:14px;font-weight:800;cursor:pointer}
  .link{font-size:15px;font-weight:700;color:var(--accent);text-decoration:none}
  .link:after{content:" ↗"}
  .thai{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted)}
  .thai .tt{font-weight:800;color:var(--ink);font-size:16px;margin-bottom:5px}
  .thai .tw{margin-top:7px;font-size:15px}
  .thai .tw b{color:var(--ink)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}
  .empty .e{font-size:42px;margin-bottom:12px}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:26px;line-height:1.6}
  .luckcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 17px;margin-bottom:16px;box-shadow:var(--shadow)}
  .luckcard>.lh{font-size:18px;font-weight:800;margin-bottom:3px}
  .luckcard>.lsub{color:var(--muted);font-size:14px;margin-bottom:13px}
  .drawbtn{width:100%;background:linear-gradient(135deg,var(--accent),#b85510);color:#fff;border:none;border-radius:14px;
    padding:20px;font-size:18px;font-weight:800;cursor:pointer;letter-spacing:.3px}
  .drawbtn:active{transform:scale(.98)}
  .reveal{animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bigname{font-size:22px;font-weight:800;color:var(--accent);line-height:1.3;margin:4px 0 2px}
  .catchip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700;margin-bottom:8px}
  .opener{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:10px;font-size:15.5px;line-height:1.55}
  .opener .ol{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px}
  .lrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .lbtn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:800;cursor:pointer}
  .lbtn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  .fline{font-size:17px;line-height:1.5;margin:2px 0 12px}
  .fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .fchip{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:15px;font-weight:700}
  .fmission{background:color-mix(in srgb,var(--green) 12%,transparent);border-radius:11px;padding:11px 14px;font-size:15.5px;color:var(--ink)}
  .fmission b{color:var(--green)}
  .fphrase{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:15.5px}
  .fphrase .pe{font-weight:800;color:var(--accent)}
  #noteArea{width:100%;min-height:55vh;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;font-family:inherit;font-size:17px;line-height:1.65;color:var(--ink);resize:vertical;box-shadow:var(--shadow)}
  #noteArea:focus{outline:2px solid var(--accent);outline-offset:1px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:no-preference){.card,.chip,.tab,.tbtn{transition:background .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <div class="brand">
      <div class="logo"><img src="app-icon-192.png" alt="MKIS"></div>
      <div>
        <h1>MKIS Morning News</h1>
        <p>English news · tap แปลไทย if you get stuck</p>
      </div>
    </div>
    <div class="hbtns">
      <button class="tbtn" id="langBtn" title="แสดงไทยทั้งหมด">TH</button>
      <button class="tbtn" id="themeBtn" title="สลับธีม" aria-label="theme">◐</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabDaily">📅 ข่าว</button>
    <button class="tab" id="tabWorld">🌍 โลก</button>
    <button class="tab" id="tabSaved">⭐ เก็บ</button>
    <button class="tab" id="tabLuck">🎲 ดวง</button>
    <button class="tab" id="tabNotes">📝 โน้ต</button>
    <button class="tab" id="tabFairs">🎪 แฟร์</button>
  </div>
</header>
<div class="wrap">
  <div id="fairAlert"></div>
  <div id="daily">
    <div class="dates" id="dates"></div>
    <div id="dayView"></div>
  </div>
  <div id="world" style="display:none"></div>
  <div id="saved" style="display:none"></div>
  <div id="luck" style="display:none"></div>
  <div id="notes" style="display:none"></div>
  <div id="fairs" style="display:none"></div>
  <div class="foot" id="foot"></div>
</div>

<script>document.write('<scr'+'ipt src="data.js?t='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>document.write('<scr'+'ipt src="world.js?t='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>
const LS='mk_news_v1', LKEY='mk_news_lang';
// ประวัติมาจากคลังบนเซิร์ฟเวอร์ (ย้อนหลัง ≤14 วัน) — เก่ารองรับ TODAY_DATA เดี่ยวด้วย
let ARCH=[];
if(window.NEWS_ARCHIVE && Array.isArray(window.NEWS_ARCHIVE.days)) ARCH=window.NEWS_ARCHIVE.days.slice();
else if(window.TODAY_DATA && window.TODAY_DATA.date) ARCH=[window.TODAY_DATA];
ARCH=ARCH.filter(d=>d&&d.date).sort((a,b)=>b.date.localeCompare(a.date));
const TODAY = ARCH[0] || null;
// คลังข่าวเทรนด์โลก (world.js)
let WARCH=[];
if(window.WORLD_ARCHIVE && Array.isArray(window.WORLD_ARCHIVE.days)) WARCH=window.WORLD_ARCHIVE.days.slice();
WARCH=WARCH.filter(d=>d&&d.date).sort((a,b)=>b.date.localeCompare(a.date));

function ageDays(dateStr){ return (Date.now()-new Date(dateStr+'T00:00:00').getTime())/86400000; }
function loadStore(){
  let s; try{ s=JSON.parse(localStorage.getItem(LS)); }catch(e){}
  if(!s||typeof s!=='object') s={};
  s.stars=s.stars||{};
  return s;
}
let store=loadStore();
store.days={};
ARCH.forEach(d=>{ store.days[d.date]=d; });
function saveStore(){ localStorage.setItem(LS,JSON.stringify({stars:store.stars})); }

let globalThai = localStorage.getItem(LKEY)==='1';
let thaiShown = new Set();   // per-card overrides (ephemeral)

function visibleItems(day){ return day.items.filter(it=> ageDays(day.date)<=14 || store.stars[it.id]); }
function isStarred(id){ return !!store.stars[id]; }
function toggleStar(item,dayDate){
  if(store.stars[item.id]) delete store.stars[item.id];
  else store.stars[item.id]={...item,day:dayDate};
  saveStore(); renderAll();
}

const TAG={auto:{emo:'🚗'}, aero:{emo:'✈️'}, steel:{emo:'🏭'}, furniture:{emo:'🪑'}, coating:{emo:'🎨'}, abrasive:{emo:'💿'}};
const WGROUPS=[
  {tag:'coating',emo:'🎨',en:'Coatings',th:'สี & Coatings'},
  {tag:'abrasive',emo:'💿',en:'Abrasives',th:'วัสดุขัด'},
  {tag:'auto',emo:'🚗',en:'Automotive & EV',th:'ยานยนต์ & EV'},
  {tag:'steel',emo:'🏭',en:'Steel & Metal',th:'เหล็ก & โลหะ'},
];
const GROUPS=[
  {tag:'auto',emo:'🚗',en:'Automotive',th:'ยานยนต์'},
  {tag:'aero',emo:'✈️',en:'Aviation',th:'การบิน'},
  {tag:'steel',emo:'🏭',en:'Steel & Metal',th:'เหล็ก & โลหะ'},
  {tag:'furniture',emo:'🪑',en:'Furniture',th:'เฟอร์นิเจอร์'},
];
const RATE={green:{cls:'green',en:'Direct',th:'เกี่ยวตรง'}, amber:{cls:'amber',en:'Indirect',th:'ทางอ้อม'}, white:{cls:'grey',en:'FYI',th:'รู้ไว้'}, grey:{cls:'grey',en:'FYI',th:'รู้ไว้'}};
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtThai(dateStr){
  const dt=new Date(dateStr+'T00:00:00');
  const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return {day:dt.getDate(),mon:m[dt.getMonth()],year:dt.getFullYear()+543,wd:['อา','จ','อ','พ','พฤ','ศ','ส'][dt.getDay()]};
}
let selDate=null, tab='daily';

function cardHTML(it,dayDate){
  const r=RATE[it.rating]||RATE.grey, t=TAG[it.tag]||{emo:''};
  const th=it.th||{};
  const hasTh = !!(th.title||th.summary||th.why);
  const showThai = globalThai;                                  // global TH mode = Thai only
  const peek = !showThai && hasTh && thaiShown.has(it.id);      // per-card peek in EN mode
  const title   = showThai&&th.title   ? th.title   : it.title;
  const summary = showThai&&th.summary ? th.summary : it.summary;
  const why     = showThai&&th.why     ? th.why     : it.why;
  const action  = showThai ? (th.action||it.action) : it.action;
  const whyLbl  = showThai ? 'สำคัญกับเรา' : 'Why it matters';
  const readLbl = showThai ? 'อ่านข่าวเต็ม' : 'read more';
  return `<article class="card">
    <div class="ctop">
      <span class="rate ${r.cls}"><span class="dot"></span>${showThai?r.th:r.en}</span>
      <button class="star ${isStarred(it.id)?'on':''}" data-id="${it.id}" data-day="${dayDate}" aria-label="save">${isStarred(it.id)?'★':'☆'}</button>
    </div>
    <h3>${esc(title)}</h3>
    <div class="src">${t.emo} ${esc(it.source)} · ${esc(it.date)}</div>
    <p class="summary">${esc(summary)}</p>
    <div class="why"><span class="k">${whyLbl}</span>${esc(why)}
      ${action?`<span class="act">→ ${esc(action)}</span>`:''}</div>
    <div class="cardfoot">
      ${!showThai&&hasTh?`<button class="xlate" data-id="${it.id}">${peek?'🇬🇧 ซ่อนไทย':'🇹🇭 แปลไทย'}</button>`:''}
      <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener">${readLbl}</a>
    </div>
    ${peek?`<div class="thai">
      <div class="tt">${esc(th.title||'')}</div>
      <div>${esc(th.summary||'')}</div>
      <div class="tw"><b>สำคัญกับเรา:</b> ${esc(th.why||'')}${th.action?` → ${esc(th.action)}`:''}</div>
    </div>`:''}
  </article>`;
}
function renderDaily(){
  const days=Object.values(store.days).filter(d=>visibleItems(d).length>0).sort((a,b)=>b.date.localeCompare(a.date));
  const dates=document.getElementById('dates'), dayView=document.getElementById('dayView');
  if(!days.length){ dates.innerHTML=''; dayView.innerHTML=`<div class="empty"><div class="e">🗞️</div>No news yet — open every morning and it stacks up here</div>`; return; }
  if(!selDate||!days.some(d=>d.date===selDate)) selDate=days[0].date;
  dates.innerHTML=days.map(d=>{const f=fmtThai(d.date);
    return `<button class="chip ${d.date===selDate?'on':''}" data-date="${d.date}"><span class="d">${f.wd}</span> ${f.day} ${f.mon}</button>`;}).join('');
  const day=store.days[selDate], vis=visibleItems(day);
  const dth=day.th||{};
  const dsum = globalThai&&dth.summary?dth.summary:day.summary;
  const execLbl = globalThai?'สรุปผู้บริหาร':'Executive summary';
  const relLbl = globalThai?'ข่าวเกี่ยวตรง':'directly relevant';
  let html=`<div class="exec"><span class="lbl">${execLbl}</span><p>${esc(dsum)}</p>`;
  if(day.directCount!=null) html+=`<span class="cnt">🟢 ${day.directCount} ${relLbl}</span>`;
  html+=`</div>`;
  for(const g of GROUPS){
    const items=vis.filter(i=>i.tag===g.tag);
    if(items.length) html+=`<div class="grouphead">${g.emo} ${globalThai?g.th:g.en}</div>`+items.map(i=>cardHTML(i,day.date)).join('');
  }
  const other=vis.filter(i=>!GROUPS.some(g=>g.tag===i.tag));
  if(other.length) html+=`<div class="grouphead">📌 ${globalThai?'อื่นๆ':'Other'}</div>`+other.map(i=>cardHTML(i,day.date)).join('');
  dayView.innerHTML=html;
}
function renderSaved(){
  const saved=document.getElementById('saved');
  const items=Object.values(store.stars).sort((a,b)=>(b.day||'').localeCompare(a.day||''));
  if(!items.length){ saved.innerHTML=`<div class="empty"><div class="e">⭐</div>No saved news yet<br>tap ☆ on a card to keep it (saved items never expire)</div>`; return; }
  saved.innerHTML=`<div class="grouphead" style="margin-top:16px">⭐ Saved (${items.length})</div>`+items.map(i=>cardHTML(i,i.day)).join('');
}
/* ---------- 🌍 เทรนด์โลก ---------- */
let selWDate=null;
function renderWorld(){
  const el=document.getElementById('world');
  const days=WARCH.filter(d=>d.items&&d.items.length).sort((a,b)=>b.date.localeCompare(a.date));
  if(!days.length){ el.innerHTML=`<div class="empty"><div class="e">🌍</div>${globalThai?'ยังไม่มีข่าวเทรนด์โลก — รอรอบข่าวเช้าพรุ่งนี้':'No world trends yet — check back after the morning run'}</div>`; return; }
  if(!selWDate||!days.some(d=>d.date===selWDate)) selWDate=days[0].date;
  const dates = days.length>1 ? `<div class="dates">`+days.map(d=>{const f=fmtThai(d.date);
    return `<button class="chip ${d.date===selWDate?'on':''}" data-wdate="${d.date}"><span class="d">${f.wd}</span> ${f.day} ${f.mon}</button>`;}).join('')+`</div>` : '';
  const day=days.find(d=>d.date===selWDate)||days[0];
  const dth=day.th||{};
  const dsum=globalThai&&dth.summary?dth.summary:day.summary;
  const execLbl=globalThai?'สรุปเทรนด์โลกวันนี้':"Today's world signals";
  let html=`<div class="grouphead" style="margin-top:16px">🌍 ${globalThai?'เทรนด์โลก':'World Trends'}</div>

/* เวลาไทยวันนี้ (YYYY-MM-DD) + จำนวนวันจนถึงงาน */
function bkkToday(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}); }
function daysUntil(iso){ const t=new Date(bkkToday()+'T00:00:00Z'), d=new Date(iso+'T00:00:00Z'); return Math.round((d-t)/86400000); }
function fairStatus(f){
  const dS=daysUntil(f.start), dE=daysUntil(f.end);
  if(dE<0) return {kind:'past', txt:'จบแล้ว', d:dE};
  if(dS<=0) return {kind:'now', txt:'🔴 กำลังจัด!', d:0};
  if(dS===1) return {kind:'soon', txt:'⏰ พรุ่งนี้!', d:1};
  if(dS<=14) return {kind:'soon', txt:'⏰ อีก '+dS+' วัน', d:dS};
  return {kind:'up', txt:'อีก '+dS+' วัน', d:dS};
}
/* ลิงก์เพิ่มลง Google ปฏิทิน (มือถือเด้งเตือนเองแม้ไม่เปิดแอป) */
function calLink(f){
  const s=f.start.replace(/-/g,''); const eD=new Date(f.end+'T00:00:00Z'); eD.setUTCDate(eD.getUTCDate()+1);
  const e=eD.toISOString().slice(0,10).replace(/-/g,'');
  const q=new URLSearchParams({action:'TEMPLATE', text:f.name, dates:s+'/'+e, details:f.why+'\n'+f.url, location:f.venue});
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}

  ta.addEventListener('input',()=>{
    localStorage.setItem(NOTESKEY, ta.value);
    st.textContent='บันทึกอัตโนมัติแล้ว ✓ '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  });
}
function updateFoot(){
  const u=TODAY?fmtThai(TODAY.date):null;
  document.getElementById('foot').innerHTML=`Unsaved news auto-clears in 14 days · ⭐ saved stays`+(u?`<br>updated ${u.day} ${u.mon} ${u.year}`:'');
}

document.getElementById('dates').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){selDate=b.dataset.date;renderDaily();}});
document.getElementById('world').addEventListener('click',e=>{const b=e.target.closest('[data-wdate]');if(b){selWDate=b.dataset.wdate;renderWorld();}});
document.body.addEventListener('click',e=>{
  const dr=e.target.closest('[data-draw]'); if(dr){ doDraw(dr.dataset.draw); return; }
  const cp=e.target.closest('[data-copy]'); if(cp){ if(navigator.clipboard) navigator.clipboard.writeText(cp.dataset.copy); const o=cp.textContent; cp.textContent='✓ คัดลอกแล้ว'; setTimeout(()=>{cp.textContent=o;},1500); return; }
  const x=e.target.closest('.xlate'); if(x){ const id=x.dataset.id; if(thaiShown.has(id))thaiShown.delete(id); else thaiShown.add(id); renderAll(); return; }
  const s=e.target.closest('.star'); if(s){const day=store.days[s.dataset.day];let it=(day&&day.items.find(x=>x.id===s.dataset.id));if(!it){for(const d of WARCH){const f=d.items&&d.items.find(x=>x.id===s.dataset.id);if(f){it=f;break;}}}it=it||store.stars[s.dataset.id];if(it)toggleStar(it,s.dataset.day);return;}
});
document.getElementById('tabDaily').addEventListener('click',()=>switchTab('daily'));
document.getElementById('tabWorld').addEventListener('click',()=>switchTab('world'));
document.getElementById('tabSaved').addEventListener('click',()=>switchTab('saved'));
document.getElementById('tabLuck').addEventListener('click',()=>switchTab('luck'));
document.getElementById('tabNotes').addEventListener('click',()=>switchTab('notes'));
document.getElementById('tabFairs').addEventListener('click',()=>switchTab('fairs'));
function switchTab(t){tab=t;
  ['Daily','World','Saved','Luck','Notes','Fairs'].forEach(n=>{
    const key=n.toLowerCase();
    document.getElementById('tab'+n).classList.toggle('on',t===key);
  });
  document.getElementById('daily').style.display=t==='daily'?'':'none';
  document.getElementById('world').style.display=t==='world'?'':'none';
  document.getElementById('saved').style.display=t==='saved'?'':'none';
  document.getElementById('luck').style.display=t==='luck'?'':'none';
  document.getElementById('notes').style.display=t==='notes'?'':'none';
  document.getElementById('fairs').style.display=t==='fairs'?'':'none';
  renderAll();
}
const langBtn=document.getElementById('langBtn');
function syncLangBtn(){ langBtn.textContent = globalThai?'EN':'TH'; langBtn.classList.toggle('on',globalThai); langBtn.title = globalThai?'กลับเป็นอังกฤษ':'แสดงไทยทั้งหมด'; }
langBtn.addEventListener('click',()=>{ globalThai=!globalThai; localStorage.setItem(LKEY,globalThai?'1':'0'); thaiShown.clear(); syncLangBtn(); renderAll(); });
const tb=document.getElementById('themeBtn');
tb.addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');
});
/* ---------- 🔔 แบนเนอร์เตือนงานแฟร์ใกล้ถึง (โผล่ทุกแท็บ) ---------- */
function renderFairAlert(){
  const el=document.getElementById('fairAlert'); if(!el) return;
  const up=FAIRS.map(f=>({f,st:fairStatus(f)})).filter(x=>x.st.kind!=='past').sort((a,b)=>a.st.d-b.st.d);
  if(!up.length){ el.innerHTML=''; return; }
  const {f,st}=up[0]; const near=st.d<=14||st.kind==='now';
  const bg=near?'#e11d48':'var(--accent)';
  el.innerHTML=`<div onclick="switchTab('fairs')" style="cursor:pointer;background:${bg};color:#fff;border-radius:12px;padding:11px 14px;margin:12px 0 4px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px;line-height:1.35">
    <span style="font-size:19px">🎪</span>
    <span style="flex:1">${st.txt} · <b>${esc(f.name.split(' — ')[0])}</b><br><span style="font-weight:500;opacity:.92;font-size:13.5px">${esc(f.date)} · ${esc(f.venue)}</span></span>
    <span style="font-size:18px;opacity:.85">›</span>
  </div>`;
}
syncLangBtn();
initNotes();
renderFairAlert();
renderAll();
</script>
</body>
</html>
